name: Build and publish initial release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mouse-nudge-initial-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\MouseNudge.sln

      - name: Build
        run: dotnet build .\MouseNudge.sln --configuration Release --no-restore

      - name: Publish self-contained executable
        run: >-
          dotnet publish .\src\MouseNudge\MouseNudge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\win-x64
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release archive
        shell: pwsh
        run: >-
          Compress-Archive
          -Path .\artifacts\win-x64\*
          -DestinationPath .\MouseNudge-v1.0.0-win-x64.zip
          -Force

      - name: Create v1.0.0 release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "Release v1.0.0 already exists; nothing to create."
            exit 0
          }

          gh release create v1.0.0 `
            .\MouseNudge-v1.0.0-win-x64.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MouseNudge v1.0.0" `
            --notes-file .\RELEASE_NOTES.md
