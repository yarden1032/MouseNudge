name: Build and publish release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.1.1
  RELEASE_ARCHIVE: MouseNudge-v1.1.1-win-x64.zip

concurrency:
  group: mouse-nudge-release
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore .\MouseNudge.sln

      - name: Build
        run: dotnet build .\MouseNudge.sln --configuration Release --no-restore

      - name: Publish self-contained executable
        run: >-
          dotnet publish .\src\MouseNudge\MouseNudge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\win-x64
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\win-x64\* `
            -DestinationPath ".\$env:RELEASE_ARCHIVE" `
            -Force

      - name: Validate published executable
        shell: pwsh
        run: .\artifacts\win-x64\MouseNudge.exe --validate

      - name: Create release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "Release $env:RELEASE_TAG already exists; nothing to create."
            exit 0
          }

          gh release create $env:RELEASE_TAG `
            ".\$env:RELEASE_ARCHIVE" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MouseNudge $env:RELEASE_TAG" `
            --notes-file .\RELEASE_NOTES.md
